name: code_quality.yml
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  run_reformat:
    runs-on: ubuntu-latest
    name: Check code
    steps:
      #Przygotowanie narzędzi
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
      - name: Restore
        run: dotnet restore MSSC-2027.sln
      - name: Tool Restore
        run: dotnet tool restore

      #Weryfikacja
      - name: Verify Analyzersac
        run: dotnet format MSSC-2027.sln --verify-no-changes
      - name: Build solution
        run: dotnet build MSSC-2027.sln --no-restore

